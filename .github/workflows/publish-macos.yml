name: Publish verified Mac download
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Verified private build commit, required for beta staging'
        required: false
        default: ''
      version:
        required: true
      arch:
        required: true
        type: choice
        options: [arm64, x86_64]
      archive_url:
        required: true
      archive_sha256:
        required: true
      draft_only:
        description: 'Stage this asset on the unpublished release'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SENECA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      SENECA_VERSION: ${{ inputs.version }}
      SENECA_ARCH: ${{ inputs.arch }}
      SENECA_ARCHIVE_URL: ${{ inputs.archive_url }}
      SENECA_ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
      SENECA_DRAFT_ONLY: ${{ inputs.draft_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mac build and upload processor-specific assets
        run: python publish_macos.py
