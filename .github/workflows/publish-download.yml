name: Publish verified Seneca download
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Verified private build commit, required for beta staging'
        required: false
        default: ''
      version:
        description: 'Verified stable version, for example 0.7.2'
        required: true
      archive_url:
        description: 'Temporary HTTPS URL for the verified binary-only build archive'
        required: true
      archive_sha256:
        description: 'SHA-256 from the successful build artifact metadata'
        required: true
      draft_only:
        description: 'Stage Windows assets while the other platform builds are added'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SENECA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      SENECA_VERSION: ${{ inputs.version }}
      SENECA_ARCHIVE_URL: ${{ inputs.archive_url }}
      SENECA_ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
      SENECA_DRAFT_ONLY: ${{ inputs.draft_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and publish completed release
        run: python publish_download.py
